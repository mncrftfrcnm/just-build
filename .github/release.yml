changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Fixes
      labels:
        - bug
        - security
    - title: Improvements
      labels:
        - enhancement
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies and maintenance
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
